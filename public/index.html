<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunde Lottery System</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h2 { font-size: 1.2rem; color: #4f46e5; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        
        /* Grid 1-50 Tiketti Filachuuf */
        .grid-tickets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 10px; }
        .t-btn { padding: 12px 5px; text-align: center; border: 1px solid #cbd5e1; border-radius: 8px; font-weight: bold; background: #fff; cursor: pointer; transition: 0.2s; }
        .t-btn.selected { background: #4f46e5; color: white; border-color: #4f46e5; }
        .t-btn.taken { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; text-decoration: line-through; }

        .form-group { margin-top: 12px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }

        .btn-submit { width: 100%; background: #22c55e; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1rem; margin-top: 15px; cursor: pointer; }
        #statusMsg { margin-top: 10px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2><i class="fa-solid fa-ticket"></i> Lakkoofsa Tiketti Filadhu (1-50)</h2>
        <p style="font-size:0.8rem; color:#64748b;">Lakkoofsa fedhte tuquun filadhu:</p>
        <div class="grid-tickets" id="ticketGrid">
            </div>
    </div>

    <div class="card">
        <h2><i class="fa-solid fa-user-pen"></i> Odeeffannoo Keeti Galchi</h2>
        <form id="buyForm">
            <div class="form-group">
                <label>Maqaa Guutuu:</label>
                <input type="text" id="fullname" placeholder="Maqaa kee galchi" required>
            </div>
            <div class="form-group">
                <label>Lakkoofsa Bilbilaa:</label>
                <input type="tel" id="phone" placeholder="0911..." required>
            </div>
            <div class="form-group">
                <label>Karaa Kaffaltii (Payment Method):</label>
                <select id="payment_method">
                    <option value="CBE Birr / CBE Account">CBE / CBE Birr</option>
                    <option value="Telebirr">Telebirr</option>
                    <option value="Bank of Abyssinia">Bank of Abyssinia</option>
                </select>
            </div>
            <div class="form-group">
                <label>Screenshot Kaffaltii (URL/Link):</label>
                <input type="text" id="screenshot" placeholder="Linkii screenshot galchi" required>
            </div>

            <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Tiketti Bitadhu</button>
        </form>
        <p id="statusMsg"></p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Mini App skriinii guutuu akka ta'uuf

        let selectedTickets = [];
        let userId = tg.initDataUnsafe?.user?.id || "UnknownUser";
        let username = tg.initDataUnsafe?.user?.username || "Guest";

        // 1. Grid Tiketti 1-50 Generaate Gochuu
        async function initTickets() {
            const grid = document.getElementById('ticketGrid');
            grid.innerHTML = '';

            // Server irraa ticket-oota bitaman fetch gochuu
            let takenTickets = [];
            try {
                const res = await fetch('/api/tickets');
                const tickets = await res.json();
                tickets.forEach(t => {
                    if (t.ticket_numbers) {
                        const nums = t.ticket_numbers.split(',').map(n => parseInt(n.trim()));
                        takenTickets.push(...nums);
                    }
                });
            } catch (e) { console.error(e); }

            for (let i = 1; i <= 50; i++) {
                const isTaken = takenTickets.includes(i);
                const btn = document.createElement('div');
                btn.className = `t-btn ${isTaken ? 'taken' : ''}`;
                btn.textContent = i;

                if (!isTaken) {
                    btn.onclick = () => toggleSelect(i, btn);
                }
                grid.appendChild(btn);
            }
        }

        // Tiketti Filachuu / Dhiisuu
        function toggleSelect(num, el) {
            if (selectedTickets.includes(num)) {
                selectedTickets = selectedTickets.filter(n => n !== num);
                el.classList.remove('selected');
            } else {
                selectedTickets.push(num);
                el.classList.add('selected');
            }
        }

        // Form Submit (Data Server-atti Erguu)
        document.getElementById('buyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('statusMsg');

            if (selectedTickets.length === 0) {
                msg.style.color = 'red';
                msg.textContent = "Moo: Maaloo jalqaba lakkoofsa tiketti filadhu!";
                return;
            }

            msg.style.color = '#4f46e5';
            msg.textContent = "Ergamaa jira...";

            const payload = {
                user_id: userId,
                username: username,
                fullname: document.getElementById('fullname').value,
                phone: document.getElementById('phone').value,
                ticket_numbers: selectedTickets.join(','),
                payment_method: document.getElementById('payment_method').value,
                screenshot: document.getElementById('screenshot').value
            };

            try {
                const res = await fetch('/api/tickets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();

                if (result.success) {
                    msg.style.color = 'green';
                    msg.textContent = "Tikettiin kee galmaa'eera! Approval Admin eegaa jira.";
                    setTimeout(() => tg.close(), 2000); // Telegram App suni cufama
                }
            } catch (err) {
                msg.style.color = 'red';
                msg.textContent = "Error: Galmeessuu hin danda'amne!";
            }
        });

        initTickets();
    </script>
</body>
</html>
